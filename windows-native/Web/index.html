<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXTHOS PROMPTS</title><style>:root{--bg:#07080b;--p:#0f1218;--p2:#151922;--l:#282e39;--t:#f6f7f9;--m:#8f98a8;--ok:#8fffb0;--err:#ff7d89}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:Inter,Segoe UI,Arial,sans-serif;user-select:none}input,textarea,select{user-select:text}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 15%,#1a202a,transparent 35%),#07080b}.authcard{width:min(440px,92vw);background:linear-gradient(180deg,#12161d,#0c0f14);border:1px solid var(--l);border-radius:28px;padding:30px;box-shadow:0 30px 90px #0008}.logo{font-size:32px;font-weight:950;letter-spacing:5px}.sub{color:var(--m);font-size:11px;letter-spacing:3px;margin:5px 0 30px}.field{width:100%;background:#090b10;border:1px solid #303744;border-radius:13px;color:#fff;padding:14px;margin:7px 0 13px;outline:0}.field:focus{border-color:#707b8d}.btn,.btn2{min-height:46px;border-radius:13px;padding:11px 15px;font-weight:850}.btn{background:#fff;color:#06070a;border:0}.btn2{background:#151922;color:#fff;border:1px solid #343b47}.row{display:flex;gap:10px}.row>*{flex:1}.msg{font-size:12px;color:var(--m);margin-top:14px}.err{color:var(--err)}.ok{color:var(--ok)}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#090b0f;border-right:1px solid var(--l);padding:20px 15px;display:flex;flex-direction:column}.brand{padding:8px 10px 25px}.brand b{letter-spacing:3px}.brand small{display:block;color:var(--m);letter-spacing:2px;margin-top:4px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;color:#a4acb9;text-align:left;border-radius:12px;padding:13px}.nav button.active,.nav button:hover{background:#151922;border-color:#262c36;color:#fff}.foot{margin-top:auto}.who{font-size:12px;color:var(--m);word-break:break-all;margin:12px 4px}.main{min-width:0}.top{position:sticky;top:0;z-index:4;background:#07080be8;backdrop-filter:blur(15px);border-bottom:1px solid #242933;padding:20px 26px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--m);font-size:13px}.content{padding:24px 26px;max-width:1450px;margin:auto}.search{width:100%;background:#0e1117;border:1px solid #292f39;border-radius:14px;padding:14px;color:#fff;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:17px}.card{background:linear-gradient(180deg,#11151c,#0d1015);border:1px solid #272d37;border-radius:20px;padding:14px}.media{width:100%;aspect-ratio:16/10;border:0;border-radius:14px;background:#050608;object-fit:cover}.badge{display:inline-block;border:1px solid #303744;background:#191e27;border-radius:999px;padding:5px 9px;font-size:10px;color:#c7ced9;margin-top:12px}.card h3{margin:10px 0 4px}.muted{color:var(--m)}.prompt{background:#080a0e;border:1px solid #20252d;border-radius:12px;padding:12px;white-space:pre-wrap;max-height:170px;overflow:auto;font-size:13px;line-height:1.5;margin:12px 0;user-select:text}.actions{display:flex;gap:8px}.actions>*{flex:1}.panel{background:linear-gradient(180deg,#11151c,#0c0f14);border:1px solid #282e39;border-radius:22px;padding:22px}.trans-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.thumb{width:100%;max-height:330px;object-fit:cover;border-radius:16px;background:#050608}.transbox{white-space:pre-wrap;user-select:text;background:#080a0e;border:1px solid #252b35;border-radius:14px;padding:16px;min-height:260px;line-height:1.65;overflow:auto}.status{font-size:12px;color:var(--m);margin:10px 0}.adminform{display:grid;gap:10px;max-width:800px}.empty{text-align:center;color:var(--m);padding:60px}.toast{position:fixed;right:24px;bottom:24px;background:#fff;color:#000;padding:12px 17px;border-radius:12px;font-weight:800;z-index:30}@media(max-width:900px){.app{grid-template-columns:78px 1fr}.brand small,.nav span,.foot{display:none}.nav button{text-align:center}.content,.top{padding-left:16px;padding-right:16px}.trans-grid{grid-template-columns:1fr}}</style></head><body><section id="auth" class="auth"><div class="authcard"><div class="logo">NEXTHOS</div><div class="sub">PROMPTS CLUB</div><h2>Entrar</h2><input id="email" class="field" type="email" placeholder="E-mail"><input id="pass" class="field" type="password" placeholder="Senha"><div class="row"><button class="btn" onclick="login()">ENTRAR</button><button class="btn2" onclick="signup()">CRIAR CONTA</button></div><div id="authmsg" class="msg">Conectando...</div></div></section><div id="app" class="app hidden"><aside class="side"><div class="brand"><b>NEXTHOS</b><small>PROMPTS CLUB</small></div><nav class="nav"><button id="nLib" class="active" onclick="view('library')">▦ <span>Biblioteca</span></button><button id="nFav" onclick="view('favorites')">★ <span>Favoritos</span></button><button id="nTr" onclick="view('transcription')">◉ <span>Transcrição</span></button><button id="nAdmin" class="hidden" onclick="view('admin')">⚙ <span>Painel Admin</span></button></nav><div class="foot"><div id="who" class="who"></div><button class="btn2" style="width:100%" onclick="logout()">Sair</button></div></aside><main class="main"><header class="top"><h1 id="title">Biblioteca NEXTHOS</h1><p id="subtitle">Prompts, imagens e vídeos sincronizados.</p></header><section class="content"><div id="library"><input id="search" class="search" placeholder="Pesquisar prompts..." oninput="render()"><div id="cards" class="grid"></div></div><div id="transcription" class="hidden"><div class="panel"><h2>Transcrição de TikTok</h2><p class="muted">Cole o link do vídeo. A requisição é feita diretamente pelo aplicativo Windows.</p><input id="tiktok" class="field" placeholder="https://www.tiktok.com/@usuario/video/..."><div class="row"><select id="lang" class="field"><option value="por-PT">Português</option><option value="eng-US">Inglês</option></select><button id="transBtn" class="btn" onclick="transcribe()">TRANSCRIBIR</button></div><div id="transStatus" class="status"></div><div id="transResult" class="trans-grid hidden"><div><img id="thumb" class="thumb" alt=""><h3 id="videoTitle"></h3></div><div><div id="transText" class="transbox"></div><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById('transText').textContent)">COPIAR TRANSCRIÇÃO</button></div></div></div></div><div id="admin" class="hidden"><div class="panel"><h2>Publicar conteúdo</h2><div class="adminform"><input id="pTitle" class="field" placeholder="Título"><input id="pCategory" class="field" placeholder="Categoria"><input id="pModel" class="field" placeholder="Modelo"><input id="pMedia" class="field" placeholder="Link Google Drive"><select id="pType" class="field"><option value="image/drive">Imagem</option><option value="video/drive">Vídeo</option></select><textarea id="pContent" class="field" rows="9" placeholder="Prompt"></textarea><button class="btn" onclick="publishPrompt()">PUBLICAR</button></div></div></div></section></main></div><div id="toast" class="toast hidden"></div><script>const URL='https://kweewflcrkugbicumazt.supabase.co',KEY='sb_publishable_9320_MX02HUeGr3helefLg_nLwqezHy';let session=null,user=null,isAdmin=false,prompts=[],current='library',lastTranscript=null;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800)}async function req(path,opt={}){const h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(URL+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||('HTTP '+r.status));return d}async function login(){try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})});session=d;user=d.user;localStorage.setItem('nexthos_session',JSON.stringify(d));await enter()}catch(e){$('authmsg').textContent=e.message;$('authmsg').className='msg err'}}async function signup(){try{const d=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})});$('authmsg').textContent=d?.access_token?'Conta criada. Entrando...':'Conta criada. Confirme o e-mail se solicitado.';if(d?.access_token){session=d;user=d.user;localStorage.setItem('nexthos_session',JSON.stringify(d));await enter()}}catch(e){$('authmsg').textContent=e.message;$('authmsg').className='msg err'}}function logout(){localStorage.removeItem('nexthos_session');location.reload()}async function enter(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||'';try{const p=await req('/rest/v1/profiles?id=eq.'+encodeURIComponent(user.id)+'&select=is_admin');isAdmin=!!p?.[0]?.is_admin}catch{}$('nAdmin').classList.toggle('hidden',!isAdmin);await load()}async function load(){let path='/rest/v1/prompts?select=*&order=created_at.desc';if(!isAdmin)path+='&published=eq.true';prompts=await req(path);render()}function favs(){try{return JSON.parse(localStorage.nexthosFavs||'[]')}catch{return[]}}function toggleFav(id){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.nexthosFavs=JSON.stringify(f);render()}function driveId(u=''){let m=String(u).match(/\/d\/([^/]+)/)||String(u).match(/[?&]id=([^&]+)/);return m?.[1]||''}function media(p){if(!p.media_path)return'';let id=driveId(p.media_path);if((p.media_type||'').startsWith('video'))return id?`<iframe class="media" src="https://drive.google.com/file/d/${id}/preview"></iframe>`:`<video class="media" controls src="${esc(p.media_path)}"></video>`;let src=id?`https://drive.google.com/uc?export=view&id=${id}`:p.media_path;return `<img class="media" src="${esc(src)}">`}function render(){let f=favs(),q=($('search')?.value||'').toLowerCase(),arr=prompts.filter(p=>(current!=='favorites'||f.includes(p.id))&&(!q||`${p.title||''} ${p.category||''} ${p.content||''}`.toLowerCase().includes(q)));$('cards').innerHTML=arr.length?arr.map(p=>`<article class="card">${media(p)}<span class="badge">${esc(p.category||'Prompt')}</span><h3>${esc(p.title||'Sem título')}</h3><div class="muted">${esc(p.model||'Universal')}</div><div class="prompt">${esc(p.content||'')}</div><div class="actions"><button class="btn" onclick="copyText(prompts.find(x=>x.id==='${p.id}').content)">COPIAR</button><button class="btn2" onclick="toggleFav('${p.id}')">${f.includes(p.id)?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">Nenhum prompt encontrado.</div>'}function view(v){current=v;['library','transcription','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==v&&(v!=='favorites'||x!=='library')));$('library').classList.toggle('hidden',!(v==='library'||v==='favorites'));$('nLib').classList.toggle('active',v==='library');$('nFav').classList.toggle('active',v==='favorites');$('nTr').classList.toggle('active',v==='transcription');$('nAdmin').classList.toggle('active',v==='admin');$('title').textContent=v==='transcription'?'Transcrição de vídeos':v==='admin'?'Painel Administrativo':v==='favorites'?'Seus favoritos':'Biblioteca NEXTHOS';if(v==='library'||v==='favorites')render()}async function copyText(t){try{await navigator.clipboard.writeText(t||'')}catch{let a=document.createElement('textarea');a.value=t||'';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copiado')}function clean(t=''){return String(t).replace(/^WEBVTT\s*/i,'').replace(/\s+/g,' ').trim()}function transcribe(){const u=$('tiktok').value.trim();if(!/^https?:\/\/(www\.)?tiktok\.com\//i.test(u)){return $('transStatus').textContent='Cole um link válido do TikTok.'}if(!window.chrome?.webview)return $('transStatus').textContent='Abra pelo NEXTHOS PROMPTS.exe nativo.';$('transBtn').disabled=true;$('transStatus').textContent='Transcrevendo...';$('transResult').classList.add('hidden');window.chrome.webview.postMessage({type:'transcribeTikTok',url:u})}if(window.chrome?.webview)window.chrome.webview.addEventListener('message',e=>{const m=e.data||{};$('transBtn').disabled=false;if(m.type==='transcriptionError'){$('transStatus').textContent=m.message||'Erro na transcrição';return}if(m.type==='transcriptionResult'){lastTranscript=m.data;showTranscript()}});function showTranscript(){const d=lastTranscript||{},txt=clean(d.transcripts?.[$('lang').value]||d.transcripts?.['por-PT']||d.transcripts?.['eng-US']||'');$('videoTitle').textContent=d.videoTitle||'Vídeo do TikTok';$('thumb').src=d.thumbnailUrl||'';$('transText').textContent=txt||'Sem transcrição.';$('transStatus').textContent='Transcrição concluída.';$('transResult').classList.remove('hidden')}$('lang').onchange=()=>{if(lastTranscript)showTranscript()};async function publishPrompt(){if(!isAdmin)return;const payload={id:crypto.randomUUID(),title:$('pTitle').value.trim(),category:$('pCategory').value.trim(),model:$('pModel').value.trim()||null,content:$('pContent').value.trim(),media_path:$('pMedia').value.trim()||null,media_type:$('pMedia').value.trim()?$('pType').value:null,media_name:$('pMedia').value.trim()?'Google Drive':null,published:true,created_by:user.id,updated_at:new Date().toISOString()};await req('/rest/v1/prompts',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});toast('Publicado');await load()}document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey&&['+','-','=','0','r','u','l'].includes(e.key.toLowerCase()))||e.key==='F5'||e.key==='F12'){e.preventDefault();e.stopPropagation()}},true);(async()=>{try{const s=JSON.parse(localStorage.getItem('nexthos_session')||'null');if(s?.access_token&&s?.user){session=s;user=s.user;await enter()}else{$('authmsg').textContent='Servidor pronto.';$('authmsg').className='msg ok'}}catch{$('authmsg').textContent='Servidor pronto.'}})();</script></body></html>
