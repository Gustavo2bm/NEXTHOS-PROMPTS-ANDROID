<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXTHOS Prompts</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#050609;color:#f5f5f7;font-family:Arial,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:720px;margin:auto;padding:20px 16px 90px}.brand{text-align:center;padding:30px 0}.logo{font-size:38px;font-weight:900;letter-spacing:5px}.muted{color:#999}.card{background:#111318;border:1px solid #24262d;border-radius:18px;padding:16px;margin:12px 0}.media{width:100%;border-radius:14px;max-height:420px;object-fit:cover;background:#000}.prompt{white-space:pre-wrap;background:#08090c;padding:14px;border-radius:12px;margin:12px 0;max-height:180px;overflow:auto}.btn{border:0;border-radius:12px;padding:13px 16px;background:#fff;color:#050609;font-weight:800}.btn2{border:1px solid #333;border-radius:12px;padding:12px 14px;background:#15171d;color:#fff}.danger{color:#ff7777}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.field{width:100%;background:#0b0d11;color:#fff;border:1px solid #30333b;border-radius:12px;padding:13px;margin:6px 0 12px}textarea.field{min-height:150px}.top{position:sticky;top:0;background:#050609ee;backdrop-filter:blur(12px);z-index:3;padding:10px 0}.nav{display:flex;gap:8px;overflow:auto}.nav button{white-space:nowrap}.hidden{display:none!important}.badge{font-size:12px;background:#23262d;padding:5px 9px;border-radius:20px}.modal{position:fixed;inset:0;background:#050609;z-index:9;overflow:auto;padding:20px}.close{float:right}.empty{text-align:center;padding:50px 20px;color:#888}h1,h2,h3{margin:8px 0}video{width:100%;border-radius:14px;background:#000}.search{width:100%;background:#101217;border:1px solid #292c34;border-radius:14px;padding:14px;color:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:12px;z-index:20}</style></head><body><div id="auth" class="wrap"><div class="brand"><div class="logo">NEXTHOS</div><div class="muted">PROMPTS CLUB</div></div><div class="card"><h2>Entrar</h2><input id="email" class="field" type="email" placeholder="E-mail"><input id="pass" class="field" type="password" placeholder="Senha"><button class="btn" onclick="login()">ENTRAR</button><button class="btn2" onclick="signup()">CRIAR CONTA</button><p id="authmsg" class="muted"></p></div></div><div id="app" class="wrap hidden"><div class="top"><div class="row"><div><b>NEXTHOS</b><div class="muted" id="who"></div></div><button class="btn2" onclick="logout()">Sair</button></div><input id="search" class="search" placeholder="Pesquisar prompts..." oninput="render()"><div class="nav"><button class="btn2" onclick="mode='all';render()">Biblioteca</button><button class="btn2" onclick="mode='fav';render()">Favoritos</button><button id="adminBtn" class="btn hidden" onclick="openEditor()">+ Publicar</button></div></div><div id="list"></div></div><div id="editor" class="modal hidden"><button class="btn2 close" onclick="closeEditor()">Fechar</button><h2 id="etitle">Novo conteúdo</h2><input id="pid" type="hidden"><label>Título</label><input id="title" class="field"><div class="row"><div><label>Categoria</label><input id="category" class="field" placeholder="Vídeo IA"></div><div><label>Modelo</label><input id="model" class="field" placeholder="Veo"></div></div><label>Link Google Drive da imagem/vídeo</label><input id="media" class="field" placeholder="https://drive.google.com/..."><label>Tipo</label><select id="mtype" class="field"><option value="image/drive">Imagem</option><option value="video/drive">Vídeo</option></select><label>Prompt</label><textarea id="content" class="field"></textarea><label><input id="published" type="checkbox" checked> Publicado</label><br><br><button class="btn" onclick="savePrompt()">PUBLICAR CONTEÚDO</button></div><div id="toast" class="toast hidden"></div><script>const URL='https://kweewflcrkugbicumazt.supabase.co',KEY='sb_publishable_9320_MX02HUeGr3helefLg_nLwqezHy';const sb=supabase.createClient(URL,KEY);let user=null,isAdmin=false,prompts=[],mode='all';const $=x=>document.getElementById(x);function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800)}async function login(){let{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('authmsg').textContent=error.message;await start(data.user)}async function signup(){let{data,error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('authmsg').textContent=error?error.message:'Conta criada. Agora entre.';if(data?.user&&data.session)await start(data.user)}async function logout(){await sb.auth.signOut();location.reload()}async function start(u){user=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email;let{data:p}=await sb.from('profiles').select('is_admin').eq('id',u.id).maybeSingle();isAdmin=!!p?.is_admin;$('adminBtn').classList.toggle('hidden',!isAdmin);await load()}async function load(){let q=sb.from('prompts').select('*').order('created_at',{ascending:false});if(!isAdmin)q=q.eq('published',true);let{data,error}=await q;if(error)return toast(error.message);prompts=data||[];render()}function driveId(u=''){let m=u.match(/\/d\/([^/]+)/)||u.match(/[?&]id=([^&]+)/);return m?.[1]||''}function media(p){if(!p.media_path)return'';let id=driveId(p.media_path);if((p.media_type||'').startsWith('video'))return id?`<iframe class="media" height="300" src="https://drive.google.com/file/d/${id}/preview" allow="autoplay"></iframe>`:`<video class="media" controls src="${esc(p.media_path)}"></video>`;let src=id?`https://drive.google.com/uc?export=view&id=${id}`:p.media_path;return `<img class="media" src="${esc(src)}">`}function favs(){try{return JSON.parse(localStorage.favs||'[]')}catch{return[]}}function toggleFav(id){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.favs=JSON.stringify(f);render()}function render(){let q=($('search')?.value||'').toLowerCase(),f=favs(),arr=prompts.filter(p=>(mode!=='fav'||f.includes(p.id))&&(!q||`${p.title} ${p.category} ${p.content}`.toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(p=>`<div class="card">${media(p)}<div class="row"><div><span class="badge">${esc(p.category||'Prompt')}</span><h3>${esc(p.title)}</h3><span class="muted">${esc(p.model||'Universal')}</span></div><button class="btn2" onclick="toggleFav('${p.id}')">${f.includes(p.id)?'★':'☆'}</button></div><div class="prompt">${esc(p.content)}</div><div class="row"><button class="btn" onclick="copyPrompt('${p.id}')">COPIAR PROMPT</button>${isAdmin?`<button class="btn2" onclick="openEditor('${p.id}')">Editar</button><button class="btn2 danger" onclick="del('${p.id}')">Excluir</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhum prompt encontrado.</div>'}async function copyPrompt(id){let p=prompts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.content)}catch{let t=document.createElement('textarea');t.value=p.content;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Prompt copiado')}function openEditor(id=''){if(!isAdmin)return;let p=prompts.find(x=>x.id===id)||{};$('pid').value=p.id||'';$('title').value=p.title||'';$('category').value=p.category||'';$('model').value=p.model||'';$('media').value=p.media_path||'';$('mtype').value=(p.media_type||'').startsWith('video')?'video/drive':'image/drive';$('content').value=p.content||'';$('published').checked=p.published!==false;$('editor').classList.remove('hidden')}function closeEditor(){$('editor').classList.add('hidden')}async function savePrompt(){let id=$('pid').value||crypto.randomUUID(),payload={id,title:$('title').value.trim(),category:$('category').value.trim(),model:$('model').value.trim()||null,content:$('content').value.trim(),media_path:$('media').value.trim()||null,media_type:$('media').value.trim()?$('mtype').value:null,media_name:$('media').value.trim()?'Google Drive':null,published:$('published').checked,created_by:user.id,updated_at:new Date().toISOString()};let{error}=await sb.from('prompts').upsert(payload);if(error)return alert(error.message);closeEditor();await load();toast('Publicado')}async function del(id){if(!confirm('Excluir este conteúdo?'))return;let{error}=await sb.from('prompts').delete().eq('id',id);if(error)return alert(error.message);await load()}sb.auth.getSession().then(({data})=>{if(data.session?.user)start(data.session.user)});sb.channel('prompts-live').on('postgres_changes',{event:'*',schema:'public',table:'prompts'},()=>load()).subscribe();</script></body></html>
