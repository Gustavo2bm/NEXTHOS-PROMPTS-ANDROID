<style>
:root{
  --bg:#07080b;--bg2:#0a0c11;--glass:rgba(15,18,25,.78);--surface:#11151d;--surface2:#171c27;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);--text:#f7f8fb;--muted:#8e98aa;
  --blue:#8ba8ff;--violet:#b497ff;--aqua:#6be4e0;--green:#71e7aa;--danger:#ff7388;

}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
body{overflow-x:hidden;background:
  radial-gradient(circle at 10% 0%,rgba(139,168,255,.10),transparent 25%),
  radial-gradient(circle at 85% 5%,rgba(180,151,255,.08),transparent 20%),

button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea{user-select:text}.hidden{display:none!important}
.eyebrow{margin:0 0 9px;color:#9ca9be;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.muted{color:var(--muted)}.empty{grid-column:1/-1;padding:58px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:22px;background:rgba(255,255,255,.015)}
/* LOADING */
.full-loader,.refresh-loader,.login-success{position:fixed;inset:0;z-index:30000;display:grid;place-items:center;background:#06070a}
.refresh-loader,.login-success{background:rgba(6,7,10,.91);backdrop-filter:blur(22px)}
.loader-card,.refresh-box,.success-box{text-align:center}
.loader-logo,.refresh-box img,.success-ring img{width:92px;height:92px;object-fit:contain}
.loader-logo{animation:logoFloat 1.8s ease-in-out infinite}
.loader-title{font-size:22px;font-weight:900;letter-spacing:.28em;margin:18px 0 3px}.loader-sub{font-size:9px;letter-spacing:.34em;color:#8993a4}
.progress{width:220px;height:2px;margin:24px auto;background:#1c2230;overflow:hidden}.progress:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));animation:progress 1.15s infinite}
@keyframes progress{from{transform:translateX(-120%)}to{transform:translateX(330%)}}@keyframes logoFloat{50%{transform:translateY(-7px) rotate(2deg)}}
.success-ring{width:148px;height:148px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(139,168,255,.24);box-shadow:0 0 70px rgba(139,168,255,.12);animation:pulse 1.4s infinite}
