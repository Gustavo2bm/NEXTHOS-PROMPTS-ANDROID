<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXTHOS Prompts</title><style>*{box-sizing:border-box}body{margin:0;background:#050609;color:#f5f5f7;font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:720px;margin:auto;padding:20px 16px 90px}.brand{text-align:center;padding:30px 0}.logo{font-size:38px;font-weight:900;letter-spacing:5px}.muted{color:#999}.card{background:#111318;border:1px solid #24262d;border-radius:18px;padding:16px;margin:12px 0}.media{width:100%;border-radius:14px;max-height:420px;object-fit:cover;background:#000;border:0}.prompt{white-space:pre-wrap;background:#08090c;padding:14px;border-radius:12px;margin:12px 0;max-height:180px;overflow:auto}.btn{border:0;border-radius:12px;padding:13px 16px;background:#fff;color:#050609;font-weight:800;min-height:48px}.btn2{border:1px solid #333;border-radius:12px;padding:12px 14px;background:#15171d;color:#fff;min-height:48px}.danger{color:#ff7777}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.field{width:100%;background:#0b0d11;color:#fff;border:1px solid #30333b;border-radius:12px;padding:13px;margin:6px 0 12px;min-height:50px}textarea.field{min-height:150px}.top{position:sticky;top:0;background:#050609ee;backdrop-filter:blur(12px);z-index:3;padding:10px 0}.nav{display:flex;gap:8px;overflow:auto}.nav button{white-space:nowrap}.hidden{display:none!important}.badge{font-size:12px;background:#23262d;padding:5px 9px;border-radius:20px}.modal{position:fixed;inset:0;background:#050609;z-index:9;overflow:auto;padding:20px}.close{float:right}.empty{text-align:center;padding:50px 20px;color:#888}h1,h2,h3{margin:8px 0}.search{width:100%;background:#101217;border:1px solid #292c34;border-radius:14px;padding:14px;color:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:12px;z-index:20}.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#0b0d11;border:1px solid #24262d;font-size:13px}.error{color:#ff8e8e}.ok{color:#8fffb0}.loading{opacity:.65;pointer-events:none}@media(max-width:520px){.wrap{padding-left:14px;padding-right:14px}.row{flex-wrap:wrap}.row>*{min-width:0}.logo{font-size:34px}.card{padding:15px}}</style></head><body><div id="auth" class="wrap"><div class="brand"><div class="logo">NEXTHOS</div><div class="muted">PROMPTS CLUB</div></div><div class="card"><h2>Entrar</h2><input id="email" class="field" type="email" inputmode="email" autocomplete="email" placeholder="E-mail"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Senha"><div class="row"><button id="loginBtn" class="btn" onclick="login()">ENTRAR</button><button id="signupBtn" class="btn2" onclick="signup()">CRIAR CONTA</button></div><div id="authmsg" class="status muted">Conectando ao servidor...</div></div></div><div id="app" class="wrap hidden"><div class="top"><div class="row"><div><b>NEXTHOS</b><div class="muted" id="who"></div></div><button class="btn2" onclick="logout()">Sair</button></div><input id="search" class="search" placeholder="Pesquisar prompts..." oninput="render()"><div class="nav"><button class="btn2" onclick="mode='all';render()">Biblioteca</button><button class="btn2" onclick="mode='fav';render()">Favoritos</button><button id="adminBtn" class="btn hidden" onclick="openEditor()">+ Publicar</button></div></div><div id="list"></div></div><div id="editor" class="modal hidden"><button class="btn2 close" onclick="closeEditor()">Fechar</button><h2>Novo conteúdo</h2><input id="pid" type="hidden"><label>Título</label><input id="title" class="field"><div class="row"><div><label>Categoria</label><input id="category" class="field" placeholder="Vídeo IA"></div><div><label>Modelo</label><input id="model" class="field" placeholder="Veo"></div></div><label>Link Google Drive da imagem/vídeo</label><input id="media" class="field" placeholder="https://drive.google.com/..."><label>Tipo</label><select id="mtype" class="field"><option value="image/drive">Imagem</option><option value="video/drive">Vídeo</option></select><label>Prompt</label><textarea id="content" class="field"></textarea><label><input id="published" type="checkbox" checked> Publicado</label><br><br><button class="btn" onclick="savePrompt()">PUBLICAR CONTEÚDO</button></div><div id="toast" class="toast hidden"></div><script>
const URL='https://kweewflcrkugbicumazt.supabase.co';
const KEY='sb_publishable_9320_MX02HUeGr3helefLg_nLwqezHy';
let session=null,user=null,isAdmin=false,prompts=[],mode='all';
const $=id=>document.getElementById(id);
const esc=(s='')=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800)}
function setAuthMsg(msg,type='muted'){$('authmsg').className='status '+type;$('authmsg').textContent=msg}
function setBusy(v){$('loginBtn').classList.toggle('loading',v);$('signupBtn').classList.toggle('loading',v)}
async function request(path,opt={}){const headers={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;const res=await fetch(URL+path,{...opt,headers});let data=null;try{data=await res.json()}catch{data=null}if(!res.ok){throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('Erro HTTP '+res.status))}return data}
async function ping(){try{await fetch(URL+'/auth/v1/health',{headers:{apikey:KEY}});setAuthMsg('Servidor conectado.','ok')}catch(e){setAuthMsg('Sem conexão com o servidor. Verifique a internet.','error')}}
async function login(){const email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return setAuthMsg('Digite e-mail e senha.','error');setBusy(true);setAuthMsg('Entrando...');try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});session=data;user=data.user;localStorage.setItem('nexthos_session',JSON.stringify(data));await start(user)}catch(e){setAuthMsg('Não foi possível entrar: '+e.message,'error')}finally{setBusy(false)}}
async function signup(){const email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6)return setAuthMsg('Informe um e-mail e senha com pelo menos 6 caracteres.','error');setBusy(true);setAuthMsg('Criando conta...');try{const data=await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(data?.access_token){session=data;user=data.user;localStorage.setItem('nexthos_session',JSON.stringify(data));await start(user)}else setAuthMsg('Conta criada. Agora toque em ENTRAR.','ok')}catch(e){setAuthMsg('Não foi possível criar: '+e.message,'error')}finally{setBusy(false)}}
function logout(){localStorage.removeItem('nexthos_session');location.reload()}
async function start(u){user=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email||'';try{const p=await request('/rest/v1/profiles?id=eq.'+encodeURIComponent(u.id)+'&select=is_admin',{headers:{Accept:'application/json'}});isAdmin=!!p?.[0]?.is_admin}catch(e){isAdmin=false} $('adminBtn').classList.toggle('hidden',!isAdmin);await load()}
async function load(){try{let path='/rest/v1/prompts?select=*&order=created_at.desc';if(!isAdmin)path+='&published=eq.true';prompts=await request(path,{headers:{Accept:'application/json'}})||[];render()}catch(e){toast('Erro ao carregar: '+e.message)}}
function driveId(u=''){let m=u.match(/\/d\/([^/]+)/)||u.match(/[?&]id=([^&]+)/);return m?.[1]||''}
function mediaHtml(p){if(!p.media_path)return'';let id=driveId(p.media_path);if((p.media_type||'').startsWith('video'))return id?`<iframe class="media" height="300" src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen"></iframe>`:`<video class="media" controls src="${esc(p.media_path)}"></video>`;let src=id?`https://drive.google.com/uc?export=view&id=${id}`:p.media_path;return `<img class="media" src="${esc(src)}">`}
function favs(){try{return JSON.parse(localStorage.favs||'[]')}catch{return[]}}
function toggleFav(id){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.favs=JSON.stringify(f);render()}
function render(){let q=($('search')?.value||'').toLowerCase(),f=favs(),arr=prompts.filter(p=>(mode!=='fav'||f.includes(p.id))&&(!q||`${p.title||''} ${p.category||''} ${p.content||''}`.toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(p=>`<div class="card">${mediaHtml(p)}<div class="row"><div><span class="badge">${esc(p.category||'Prompt')}</span><h3>${esc(p.title||'Sem título')}</h3><span class="muted">${esc(p.model||'Universal')}</span></div><button class="btn2" onclick="toggleFav('${p.id}')">${f.includes(p.id)?'★':'☆'}</button></div><div class="prompt">${esc(p.content||'')}</div><div class="row"><button class="btn" onclick="copyPrompt('${p.id}')">COPIAR PROMPT</button>${isAdmin?`<button class="btn2" onclick="openEditor('${p.id}')">Editar</button><button class="btn2 danger" onclick="delPrompt('${p.id}')">Excluir</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhum prompt encontrado.</div>'}
async function copyPrompt(id){let p=prompts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.content||'')}catch{let t=document.createElement('textarea');t.value=p.content||'';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Prompt copiado')}
function openEditor(id=''){if(!isAdmin)return;let p=prompts.find(x=>x.id===id)||{};$('pid').value=p.id||'';$('title').value=p.title||'';$('category').value=p.category||'';$('model').value=p.model||'';$('media').value=p.media_path||'';$('mtype').value=(p.media_type||'').startsWith('video')?'video/drive':'image/drive';$('content').value=p.content||'';$('published').checked=p.published!==false;$('editor').classList.remove('hidden')}
function closeEditor(){$('editor').classList.add('hidden')}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
async function savePrompt(){try{const id=$('pid').value||uuid(),payload={id,title:$('title').value.trim(),category:$('category').value.trim(),model:$('model').value.trim()||null,content:$('content').value.trim(),media_path:$('media').value.trim()||null,media_type:$('media').value.trim()?$('mtype').value:null,media_name:$('media').value.trim()?'Google Drive':null,published:$('published').checked,created_by:user.id,updated_at:new Date().toISOString()};await request('/rest/v1/prompts?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)});closeEditor();await load();toast('Publicado')}catch(e){alert('Erro ao publicar: '+e.message)}}
async function delPrompt(id){if(!confirm('Excluir este conteúdo?'))return;try{await request('/rest/v1/prompts?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert('Erro ao excluir: '+e.message)}}
async function restore(){await ping();try{const raw=localStorage.getItem('nexthos_session');if(!raw)return;const saved=JSON.parse(raw);if(!saved?.access_token||!saved?.user)return;session=saved;user=saved.user;await start(user)}catch(e){localStorage.removeItem('nexthos_session')}}
window.addEventListener('online',()=>setAuthMsg('Internet reconectada.','ok'));window.addEventListener('offline',()=>setAuthMsg('Sem internet.','error'));restore();setInterval(()=>{if(user)load()},30000);
</script></body></html>
