plugins { id 'com.android.application' }

android {
    namespace 'club.nexthos.prompts'
    compileSdk 35

    defaultConfig {
        applicationId 'club.nexthos.prompts'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '22.0-mobile'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
