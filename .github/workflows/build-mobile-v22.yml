name: Build NEXTHOS V22 Mobile APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar projeto V22 Mobile
        run: |
          set -e
          tr -d '\r\n ' < mobile-v22/source.part01 | base64 -d > /tmp/nexthos-v22.tar.gz
          gzip -t /tmp/nexthos-v22.tar.gz
          tar -xzf /tmp/nexthos-v22.tar.gz
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/club/nexthos/prompts/MainActivity.java

      - name: Compilar APK V22
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/NEXTHOS-PROMPTS-V22-MOBILE.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXTHOS-PROMPTS-V22-MOBILE-APK
          path: apk-output/NEXTHOS-PROMPTS-V22-MOBILE.apk
          if-no-files-found: error
