name: Build NEXTHOS Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-native/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: windows-native
        run: dotnet restore

      - name: Publish Windows x64
        working-directory: windows-native
        run: dotnet publish -c Release -r win-x64 --self-contained true

      - name: Upload NEXTHOS EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEXTHOS-PROMPTS-WINDOWS
          path: windows-native/bin/Release/net8.0-windows/win-x64/publish/**

      - name: Save test build in branch
        if: github.ref_name == 'nexthos-v21-4-7-native-overlay'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'windows-native/bin/Release/net8.0-windows/win-x64/publish/NEXTHOS PROMPTS.exe' 'dist/NEXTHOS_V21_4_7_NATIVE_OVERLAY.exe' -Force
          Compress-Archive -Path 'windows-native/bin/Release/net8.0-windows/win-x64/publish/*' -DestinationPath 'dist/NEXTHOS_V21_4_7_NATIVE_OVERLAY_PUBLISH.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Save Windows V21.4.7 test build [skip ci]'
          git push
