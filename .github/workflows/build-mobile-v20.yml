name: Build NEXTHOS Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-release/**'
      - '.github/workflows/build-mobile-v20.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore mobile project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile-build
          mkdir -p mobile-build
          ZIP='mobile-release/NEXTHOS_PROMPTS_V20_1_MOBILE_ANDROID.zip'
          # O arquivo foi armazenado no repositório como texto Base64. Decodifica primeiro.
          tr -d '\r\n ' < "$ZIP" | base64 --decode > /tmp/nexthos-mobile.zip
          unzip -t /tmp/nexthos-mobile.zip
          unzip -q /tmp/nexthos-mobile.zip -d mobile-build
          test -f mobile-build/NEXTHOS_PROMPTS_V20_1_MOBILE_ANDROID/settings.gradle
          test -f mobile-build/NEXTHOS_PROMPTS_V20_1_MOBILE_ANDROID/app/build.gradle

      - name: Build debug APK
        working-directory: mobile-build/NEXTHOS_PROMPTS_V20_1_MOBILE_ANDROID
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp mobile-build/NEXTHOS_PROMPTS_V20_1_MOBILE_ANDROID/app/build/outputs/apk/debug/app-debug.apk 'apk-output/NEXTHOS-PROMPTS-V20.1-MOBILE.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXTHOS-PROMPTS-V20.1-MOBILE-APK
          path: apk-output/NEXTHOS-PROMPTS-V20.1-MOBILE.apk
          if-no-files-found: error
