name: Build NEXTHOS Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-mobile-v20.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          echo 'Projeto Android encontrado e validado.'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          set -e
          mkdir -p apk-output
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk 'apk-output/NEXTHOS-PROMPTS-MOBILE.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXTHOS-PROMPTS-MOBILE-APK
          path: apk-output/NEXTHOS-PROMPTS-MOBILE.apk
          if-no-files-found: error
